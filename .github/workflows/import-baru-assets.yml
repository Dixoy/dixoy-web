name: Import Baru assets

on:
  push:
    branches:
      - "feat/design-portfolio-v1"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "feat/design-portfolio-v1"
          fetch-depth: 0

      - name: Extract eight WEBP assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          expected = [
              "public/media/portfolio/design/baru-carta-frescos.webp",
              "public/media/portfolio/design/baru-carta-salchipapas.webp",
              "public/media/portfolio/design/baru-diseno-ilustrado.webp",
              "public/media/portfolio/design/baru-diseno-naranja.webp",
              "public/media/portfolio/design/baru-diseno-verde.webp",
              "public/media/portfolio/design/baru-real-espacio.webp",
              "public/media/portfolio/design/baru-render-espacio.webp",
              "public/media/portfolio/design/baru-render-marca.webp",
          ]

          with ZipFile("BARU-imagenes-para-PR15.zip") as package:
              entries = sorted(i.filename.replace("\\", "/") for i in package.infolist() if not i.is_dir())
              if entries != expected:
                  raise SystemExit(f"Unexpected ZIP entries: {entries}")
              for name in expected:
                  data = package.read(name)
                  if len(data) < 12 or data[:4] != b"RIFF" or data[8:12] != b"WEBP":
                      raise SystemExit(f"Invalid WEBP: {name}")
                  target = Path(name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  print(name, len(data))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify portfolio page and assets
        run: |
          python3 -m http.server 4173 --directory out >/tmp/baru-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            curl -fsS http://127.0.0.1:4173/portafolio/diseno >/tmp/portfolio-design.html && break
            sleep 1
          done
          test -s /tmp/portfolio-design.html

          for file in \
            baru-carta-frescos.webp \
            baru-carta-salchipapas.webp \
            baru-diseno-ilustrado.webp \
            baru-diseno-naranja.webp \
            baru-diseno-verde.webp \
            baru-real-espacio.webp \
            baru-render-espacio.webp \
            baru-render-marca.webp
          do
            grep -Fq "$file" /tmp/portfolio-design.html
            curl -fsSI "http://127.0.0.1:4173/media/portfolio/design/$file" >/tmp/headers
            grep -Eiq '^HTTP/.* 200' /tmp/headers
            grep -Eiq '^Content-Type: image/webp' /tmp/headers
          done

      - name: Commit assets and remove temporary files
        run: |
          git add public/media/portfolio/design/baru-*.webp
          git rm BARU-imagenes-para-PR15.zip
          git rm .github/workflows/import-baru-assets.yml

          expected=$(printf '%s\n' \
            .github/workflows/import-baru-assets.yml \
            BARU-imagenes-para-PR15.zip \
            public/media/portfolio/design/baru-carta-frescos.webp \
            public/media/portfolio/design/baru-carta-salchipapas.webp \
            public/media/portfolio/design/baru-diseno-ilustrado.webp \
            public/media/portfolio/design/baru-diseno-naranja.webp \
            public/media/portfolio/design/baru-diseno-verde.webp \
            public/media/portfolio/design/baru-real-espacio.webp \
            public/media/portfolio/design/baru-render-espacio.webp \
            public/media/portfolio/design/baru-render-marca.webp | sort)
          actual=$(git diff --cached --name-only | sort)
          test "$actual" = "$expected"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add Baru portfolio images"
          git push origin HEAD:feat/design-portfolio-v1
