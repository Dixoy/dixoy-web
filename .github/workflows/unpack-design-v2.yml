name: Unpack design v2 package

on:
  push:
    branches:
      - feat/design-portfolio-v1

permissions:
  contents: write

jobs:
  unpack:
    if: github.event.head_commit.message == 'ci: unpack design v2 package'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/design-portfolio-v1
      - name: Extract package
        run: |
          rm -rf .codex-package
          mkdir -p .codex-package
          unzip -q dixoy-diseno-v2-para-codex.zip -d .codex-package
          find .codex-package -type d -name __MACOSX -prune -exec rm -rf {} +
          find .codex-package -type f -name '.DS_Store' -delete
          find .codex-package -maxdepth 4 -type f | sort
      - name: Commit extracted package
        run: |
          git config user.name "Dixoy"
          git config user.email "91508902+Dixoy@users.noreply.github.com"
          git add .codex-package
          git commit -m "chore: unpack design package for review"
          git push origin HEAD:feat/design-portfolio-v1
