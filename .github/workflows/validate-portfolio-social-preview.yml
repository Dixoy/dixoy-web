name: Validate portfolio social preview

on:
  pull_request:
    paths:
      - "app/portafolio/diseno/**"
      - ".github/workflows/validate-portfolio-social-preview.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check generated Open Graph asset
        run: |
          test -f out/portafolio/diseno/index.html
          find out/portafolio/diseno -maxdepth 2 -type f | sort
          grep -o 'property="og:image"[^>]*' out/portafolio/diseno/index.html || true
