name: Validate portfolio social preview

on:
  pull_request:
    paths:
      - "app/layout.tsx"
      - "public/favicon.svg"
      - "app/portafolio/diseno/**"
      - "app/portafolio/filmaker/**"
      - "app/portafolio/PortfolioTabs.tsx"
      - "app/portafolio/portfolio-tabs.module.css"
      - "public/media/portfolio/filmaker/**"
      - "tests/filmaker.test.mjs"
      - "scripts/prepare-portfolio-og.mjs"
      - ".github/workflows/validate-portfolio-social-preview.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:filmaker
      - run: npm run build
      - name: Check both portfolio social images and HTML metadata
        run: |
          for slug in diseno filmaker; do
            test -f "out/portafolio/$slug.html"
            test -s "out/portafolio/$slug/opengraph-image.png"
            test -s "out/portafolio/$slug/twitter-image.png"
            file "out/portafolio/$slug/opengraph-image.png"
            grep -q 'property="og:image"' "out/portafolio/$slug.html"
            grep -q "https://dixoy.co/portafolio/$slug/opengraph-image.png" "out/portafolio/$slug.html"
            grep -q 'name="twitter:image"' "out/portafolio/$slug.html"
          done
      - name: Confirm portfolio creator credit
        run: |
          grep -q "Productor multimedia" out/portafolio/diseno.html
          grep -q "opengraph-image.png?v=2" out/portafolio/diseno.html
          if grep -q "Dirección de diseño" out/portafolio/diseno.html; then
            echo "Outdated professional title in Diseño portfolio"
            exit 1
          fi
      - name: Check DIXOY favicon is exported and referenced
        run: |
          test -s out/favicon.svg
          grep -q '#0b3559' out/favicon.svg
          grep -q 'fill="#ffffff"' out/favicon.svg
          grep -q 'favicon.svg?v=2' out/index.html
