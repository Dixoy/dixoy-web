name: Validate ZOORI assets
on:
  push:
    branches:
      - feat/design-portfolio-v1
    paths:
      - .github/workflows/import-zoori-images.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/design-portfolio-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Verify exported ZOORI files
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "zoori-logo.webp"
            "zoori-aplicaciones.webp"
            "zoori-variaciones.webp"
          )
          for file in "${expected[@]}"; do
            test -s "out/media/portfolio/design/$file"
            file "out/media/portfolio/design/$file" | grep -qi 'webp'
          done
      - name: Verify portfolio route and image responses
        shell: bash
        run: |
          set -euo pipefail
          npx --yes serve@14.2.5 out --listen 3000 --no-clipboard > /tmp/zoori-serve.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3000/portafolio/diseno > /tmp/portfolio.html; then
              break
            fi
            sleep 1
          done

          test -s /tmp/portfolio.html
          for file in zoori-logo.webp zoori-aplicaciones.webp zoori-variaciones.webp; do
            grep -Fq "$file" /tmp/portfolio.html
            headers=$(curl --fail --silent --show-error --head "http://127.0.0.1:3000/media/portfolio/design/$file")
            printf '%s\n' "$headers" | grep -Eqi '^HTTP/.* 200'
            printf '%s\n' "$headers" | grep -Eqi '^Content-Type: image/webp'
          done
